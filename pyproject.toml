[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "european-resilience-intelligence"
version = "0.1.0"
description = "Geospatial decision-support platform for essential-service continuity and regional resilience in the Baltic states."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "REPLACE_ME" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pandera>=0.19",
]
graph = ["networkx>=3.3"]
ml = ["scikit-learn>=1.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
